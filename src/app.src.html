:root{

}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--f-pixel);font-size:13px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px;

.trend .st{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.trend .st i{display:block;border:2px solid var(--line);border-bottom:none}
.trend .st i:last-child{border-bottom:2px solid var(--line)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--ink-soft);flex-wrap:wrap}

.empty{padding:14px;text-align:center;color:var(--ink-soft);border:2px dashed #d9c7a9}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

dialog{border:3px solid var(--line);background:var(--paper);padding:0;box-shadow:6px 6px 0 var(--line);width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 40px)}

input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],input[type=url],select,textarea{border:2px solid var(--line);background:#fff;padding:6px 8px;width:100%;font-size:14px}

.vbud{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;height:170px}.vb{flex:0 0 62px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:12px}.vb .vt{flex:1;width:26px;border:2px solid var(--line);background:#fff;display:flex;align-items:flex-end}.vb .vt i{display:block;width:100%}.vb .pc{font-size:11px;font-weight:700}.vb>b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}.vb .small{white-space:nowrap;font-size:10px}.sumtbl td,.sumtbl th,.uptbl td{padding:3px 4px}.uptbl td{vertical-align:middle}.upwrap{max-height:150px;overflow:auto}.uptbl .ucd{width:86px;white-space:nowrap}.dday{white-space:nowrap}.uptbl .ucw{width:44px}.uptbl .ucb{width:22px;text-align:center}.uptbl td+td,.sumtbl td+td,.sumtbl th+th{border-left:1px dashed #c9b28d}.uptbl{border:1px dashed #c9b28d}.sumtbl tr.tot td{border-top:2px solid var(--line);background:#fbeede}.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pick button{display:grid;gap:2px;text-align:left;padding:10px;border:2px solid var(--line);background:#fff;box-shadow:3px 3px 0 var(--line);cursor:pointer}.pick button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}.pick .pi{font-size:22px}.sumrows{display:grid;gap:3px;margin:6px 0}.sumrows .row{border-bottom:1px dotted var(--line-soft,#d9c9a8);padding:2px 0}
details.sms{border:2px dashed var(--line);padding:6px 8px;display:grid;gap:6px}details.sms summary{cursor:pointer;font-weight:700;font-size:13px}details.sms[open]{gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid var(--line);background:#fff;padding:2px 8px;cursor:pointer;font-size:12px}

.st-badge.new{background:#fff0b8}.st-badge.done{background:#bfe8c8}.st-badge.doing{background:var(--plum-soft)}
.pre{background:#2b2024;color:#f6e9d6;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:11px;white-space:pre;overflow:auto;max-height:200px;border:2px solid var(--line)}

.room canvas{cursor:pointer}

<script>
/* ---------- 기본값 ---------- */
const VERSION='0.9.1';
const CATS={
  지출:['식비','장보기','카페·간식','외식·데이트','배달','교통·차','주거·관리비','통신','구독','쇼핑','의료','경조사','여행·여가','세금·보험','기타'],
  수입:['월급','3.3% 뗀 수입','안 뗀 부업수입','용돈·선물','기타'],
  저축:['적금','예금','투자','비상금','기타']};

const CATS0=JSON.parse(JSON.stringify(CATS));

/* ---------- 저장소: 모든 기록은 {id, kind, ..., t(수정시각), del} ---------- */
const Store={
  recs:ls.get('jy.recs',{}),
  listeners:[],
  all(kind){return Object.values(this.recs).filter(r=>r.kind===kind&&!r.del)},
  get(id){const r=this.recs[id];return r&&!r.del?r:null},
  put(rec){rec.t=Date.now();rec.by=me();this.recs[rec.id]=rec;this.save();Sync.push([rec]);this.changed()},
  del(id){const r=this.recs[id];if(!r)return;r.del=true;r.t=Date.now();this.save();Sync.push([r]);this.changed()},
  merge(list){let ch=false;for(const r of list){if(!r||!r.id)continue;const cur=this.recs[r.id];if(!cur||(r.t||0)>=(cur.t||0)){if(!cur||JSON.stringify(cur)!==JSON.stringify(r)){this.recs[r.id]=r;ch=true}}}if(ch){this.save();this.changed()}},
  save(){ls.set('jy.recs',this.recs)},
  changed(){render()}
};
const settings=()=>Store.get('settings')||{id:'settings',kind:'settings',goal:30000000,goalName:'우리 집 마련 첫걸음',cardDay:{주니:10,영이:14}};

/* ---------- 공유(동기화) ---------- */
const Sync={
  mode:'local',queue:ls.get('jy.queue',[]),since:ls.get('jy.since',0),timer:null,db:null,
  status(txt,cls){const el=document.getElementById('live');el.className='live '+(cls||'');document.getElementById('liveTxt').textContent=txt},
  cfg(){return ls.get('jy.sheet',null)},
  async start(){
    // 1) Claude 링크 안에서 열렸으면 공유 DB 사용
    try{if(window.claude&&window.claude.use){const db=await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),6000))]);
      if(db){this.db=db;this.mode='claude';this.status('함께 쓰는 중','on');
        db.collection('records').onSnapshot(s=>{Store.merge(s.docs.map(d=>d.data()))},()=>this.status('연결이 잠깐 끊겼어요','err'));
        if(this.queue.length){const q=this.queue;this.queue=[];ls.set('jy.queue',[]);this.push(q)}return}}}catch(e){}
    // 2) 구글 시트 주소가 있으면 시트로 공유
    if(this.cfg()){this.mode='sheet';this.pull();clearInterval(this.timer);this.timer=setInterval(()=>this.pull(),20000);return}
    this.mode='local';this.status('이 컴퓨터에만 저장 중','');
  },
  push(list){
    if(this.mode==='claude'){for(const r of list)this.db.collection('records').doc(r.id).set(r).catch(()=>this.status('저장이 안 됐어요. 다시 시도해요','err'));return}
    if(this.mode==='sheet'){this.queue.push(...list);ls.set('jy.queue',this.queue);this.flush();return}
  },
  async flush(){const c=this.cfg();if(!c||!this.queue.length)return;const rows=this.queue.slice();
    try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:c.key,rows})});const j=await r.json();if(!j.ok)throw new Error(j.error||'fail');
      this.queue=this.queue.slice(rows.length);ls.set('jy.queue',this.queue);this.status('함께 저장됨 '+new Date().toTimeString().slice(0,5),'on')}
    catch(e){this.status('인터넷 연결을 확인해 주세요 (기록은 이 컴퓨터에 남아 있어요)','err')}},
  async pull(){const c=this.cfg();if(!c)return;
    try{const r=await fetch(c.url+(c.url.includes('?')?'&':'?')+'key='+encodeURIComponent(c.key)+'&since='+this.since);const j=await r.json();if(!j.ok)throw new Error(j.error||'fail');
      Store.merge(j.rows.map(x=>{try{return JSON.parse(x.json)}catch(e){return null}}));this.since=j.now;ls.set('jy.since',j.now);inboxRun();
      await this.flush();if(!this.queue.length)this.status('함께 쓰는 중 · '+new Date().toTimeString().slice(0,5),'on')}
    catch(e){this.status(e.message==='bad key'?'우리집 비밀번호가 달라요':'인터넷 연결을 확인해 주세요','err')}}
};

// 폰이 보낸 결제 알림(inbox) → 지출 기록. 두 컴퓨터가 같이 처리해도 같은 id라 한 번만 남아요
function inboxRun(){const list=Store.all('inbox');if(!list.length)return;let n=0;
  for(const ib of list){const p=parsePay(ib.text);const who=WHO.includes(ib.who)?ib.who:'주니';
    if(p&&p.cancel){const old=Store.all('entry').filter(e=>e.src==='auto'&&e.amount===p.amount&&e.who===who&&(!p.memo||e.memo===p.memo)).sort((a,b)=>b.date.localeCompare(a.date))[0];if(old){Store.recs[old.id]={...old,del:true,t:Date.now()};Sync.push([Store.recs[old.id]]);n++}}
    else if(p&&!selfIn(p)){const id='auto_'+ib.id;if(!Store.recs[id]){const e={id,kind:'entry',type:p.type,who,amount:p.amount,cat:p.cat||CATS[p.type][CATS[p.type].length-1],memo:p.memo,date:p.date,pay:p.type==='지출'?'카드':'',src:'auto',t:Date.now(),by:who};Store.recs[id]=e;Sync.push([e]);n++}}
    Store.recs[ib.id]={...ib,del:true,t:Date.now()};Sync.push([Store.recs[ib.id]])}
  Store.save();Store.changed();if(n)toast('폰 결제 알림 '+n+'건을 가계부에 적었어요')}

/* ---------- 계산 ---------- */
function monthData(m){
  const es=Store.all('entry').filter(e=>ym(e.date)===m);
  const sum=(f)=>es.filter(f).reduce((a,e)=>a+Number(e.amount||0),0);
  const spend=sum(e=>e.type==='지출'),inc=sum(e=>e.type==='수입'),sav=sum(e=>e.type==='저축');
  const byWho={};for(const w of WHO)byWho[w]=sum(e=>e.type==='지출'&&e.who===w);
  const bills=Store.all('bill').filter(b=>b.month===m);
  const bill=bills.reduce((a,b)=>a+Number(b.amount||0),0);
  return{es,spend,inc,sav,byWho,bills,bill};
}

function level(rate){const L=[[-1,1,'첫걸음 부부'],[0,2,'버티는 부부'],[.1,3,'아끼는 부부'],[.2,4,'알뜰 새싹 부부'],[.3,5,'알뜰 부부'],[.4,6,'단단한 알뜰 부부'],[.5,7,'튼튼한 알뜰 부부'],[.6,8,'부자 예약 부부']];let r=L[0];for(const x of L)if(rate>=x[0])r=x;return{lv:r[1],name:r[2]}}
function ddayOf(m,day){const[y,mo]=m.split('-').map(Number);const due=new Date(y,mo-1,day);const t=new Date();t.setHours(0,0,0,0);return Math.round((due-t)/864e5)}

// 총 지출 = 현금지출 + 카드값 + 고정지출(카드값에 든 것 빼고) + 대출. 규칙은 가계부_계산규칙.md
function spendSum(m){const d=monthData(m);const z=()=>({주니:0,영이:0,같이:0,all:0});const add=(o,w,v)=>{v=Number(v||0);o[WHO.includes(w)?w:'같이']+=v;o.all+=v};
  const cash=z(),bill=z(),fixed=z(),loan=z(),total=z();
  for(const e of d.es)if(e.type==='지출'&&e.pay!=='카드'&&!e.fixedRef)add(cash,e.who,e.amount);
  for(const b of d.bills)add(bill,b.who,b.amount);
  const billWho=new Set(d.bills.filter(b=>Number(b.amount)>0).map(b=>b.who));
  for(const x of fixedFor(m))if(!fixIsCard(x.f)||!billWho.has(x.f.who))add(fixed,x.f.who,x.f.amount);
  for(const x of loansFor(m))add(loan,x.l.who,x.l.monthly);
  for(const o of [cash,bill,fixed,loan])for(const k of [...WHO,'all'])total[k]+=o[k];
  return{cash:cash.all,bill:bill.all,fixed:fixed.all,loan:loan.all,total:total.all,by:{cash,bill,fixed,loan,total}}}
function etaText(left){if(left<=0)return ' · 목표 달성! 🎉';const ms=[];for(let k=0;k<3;k++){const m=addMonth(cur,-k);const x=monthData(m);ms.push(x.sav)}const avg=ms.reduce((a,b)=>a+b,0)/3;if(avg<=0)return '';const n=Math.ceil(left/avg);const end=addMonth(cur,n);return ` · 지금 속도면 ${mLabel(end)}에 목표 도착`}
function catBars(es){
  const sp=es.filter(e=>e.type==='지출');if(!sp.length)return '<div class="empty">이번 달 지출이 아직 없어요.</div>';
  const by={};for(const e of sp){by[e.cat]=by[e.cat]||{주니:0,영이:0,같이:0};by[e.cat][e.who]+=Number(e.amount)}
  const rows=Object.entries(by).map(([c,v])=>({c,a:v.주니+v.같이/2,b:v.영이+v.같이/2})).sort((x,y)=>(y.a+y.b)-(x.a+x.b)).slice(0,6);
  const mx=Math.max(...rows.map(r=>Math.max(r.a,r.b)),1);
  return `<div class="bars">${rows.map(r=>`<div class="l" title="주니 ${won(r.a)} · 영이 ${won(r.b)}"><span>${esc(r.c)}</span><div class="a" style="width:${r.a/mx*100}%"></div><div class="b" style="width:${r.b/mx*100}%"></div></div>`).join('')}</div><p class="small" style="margin:8px 0 0">'같이' 쓴 돈은 반씩 나눠서 그렸어요.</p>`}

function vReport(){

  const tot=v=>v.주니+v.영이+v.같이;const rows=Object.entries(by).sort((a,b)=>tot(b[1])-tot(a[1]));

  <div class="card"><h3>${mLabel(cur)} 분류별 지출</h3>${rows.length?`<div class="tblwrap"><table><tr><th>분류</th><th class="m">주니</th><th class="m">영이</th><th class="m">같이</th><th class="m">합계</th></tr>${grows.map(([g,v,subs])=>`<tr class="grp"><td><b>${g}</b> <span class="small">${d.spend?Math.round(tot(v)/d.spend*100):0}%</span></td><td class="m">${won(v.주니)}</td><td class="m">${won(v.영이)}</td><td class="m">${won(v.같이)}</td><td class="m"><b>${won(tot(v))}</b></td></tr>${subs.map(([c,v])=>`<tr class="sub"><td>└ ${esc(c)}</td><td class="m">${won(v.주니)}</td><td class="m">${won(v.영이)}</td><td class="m">${won(v.같이)}</td><td class="m">${won(tot(v))}</td></tr>`).join('')}`).join('')}<tr><td><b>합계</b></td><td class="m">${won(d.byWho.주니)}</td><td class="m">${won(d.byWho.영이)}</td><td class="m">${won(d.byWho.같이)}</td><td class="m"><b>${won(d.spend)}</b></td></tr></table></div>`:'<div class="empty">이 달 지출 기록이 없어요.</div>'}</div></div></div>`}

const BUDGETS=[['식비',['식비','장보기','카페·간식']],['배달+외식',['배달','외식·데이트']]];
function catSpend(m){const by={};for(const e of monthData(m).es)if(e.type==='지출')by[e.cat]=(by[e.cat]||0)+Number(e.amount||0);return by}
function budgetRows(m){const b=settings().budgets||{},by=catSpend(m);return BUDGETS.map(([n,cs])=>({c:n,cats:cs,b:Number(b[n]??(n==='배달+외식'?b.배달:0))||0,s:cs.reduce((a,c)=>a+(by[c]||0),0)})).filter(x=>x.b>0)}
function budgetCard(m){const R=budgetRows(m);
  return `<div class="card"><h3>${Number(m.slice(5))}월 예산 <span class="r"><button type="button" class="btn ghost" style="padding:0 6px;font-size:10px;box-shadow:2px 2px 0 var(--line)" data-budget="1">정하기</button></span></h3>${R.length?R.map(x=>{const pc=x.s/x.b*100,over=x.s>x.b,warn=pc>=80,col=over?'var(--red)':warn?'var(--warn)':'var(--good)';
    return `<div class="tb" title="${esc(x.cats.join(' + '))}"><div class="row"><b>${esc(x.c)}</b><span class="small">${man(x.s)} / ${man(x.b)} ${over?'<b style="color:var(--red)">넘음</b>':''}</span></div><div class="hp" style="height:10px"><span style="width:${Math.min(100,pc)}%;background:${col}"></span></div></div>`}).join('')
    :'<div class="small">식비, 배달+외식 예산을 정해 보세요.</div>'}</div>`}
function budgetDlg(){const s=settings(),R=budgetRows(cur),cur0=n=>(R.find(x=>x.c===n)||{}).b||'';
  openDlg('한 달 예산',`<div class="small">두 묶음만 봐요. 묶음 안 분류를 다 더해서 비교해요(카드·현금 모두).</div>${BUDGETS.map(([n,cs])=>`<label class="f">${esc(n)} <span class="small">(${esc(cs.join(' + '))})</span><input type="text" inputmode="numeric" data-bud="${esc(n)}" value="${cur0(n)?won(cur0(n)):''}" placeholder="예) 600,000"></label>`).join('')}`,'저장',()=>{
    const o={};document.querySelectorAll('[data-bud]').forEach(el=>{const n=Number(el.value.replace(/[^0-9]/g,''));if(n>0)o[el.dataset.bud]=n});Store.put({...s,budgets:o});toast('예산을 저장했어요')});
  document.querySelectorAll('[data-bud]').forEach(a=>a.addEventListener('input',()=>{const n=a.value.replace(/[^0-9]/g,'');a.value=n?Number(n).toLocaleString('ko-KR'):''}))}
// m월 돌아보기: 전달과 비교, 많이 쓴 대분류, 가장 많이 늘어난 분류, 예산 넘은 분류
function reviewCard(m,title){const d=monthData(m),p=monthData(addMonth(m,-1));if(!d.spend)return '';
  const by=catSpend(m),pb=catSpend(addMonth(m,-1));const G={};for(const[c,v]of Object.entries(by)){const g=catGroup(c);G[g]=(G[g]||0)+v}
  const top=Object.entries(G).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const up=Object.keys(by).map(c=>[c,by[c]-(pb[c]||0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0];
  const over=budgetRows(m).filter(x=>x.s>x.b);const diff=p.spend?Math.round((d.spend-p.spend)/p.spend*100):null;
  return `<div class="card" style="background:#f3f0ff"><h3>📋 ${title||mLabel(m)+' 돌아보기'}</h3>
  <div class="small">쓴 돈 <b>${won(d.spend)}원</b>${diff!=null?` · ${Number(addMonth(m,-1).slice(5))}월보다 <b style="color:${diff>0?'var(--red)':'var(--good)'}">${diff>0?diff+'% 늘었어요':diff<0?(-diff)+'% 줄었어요':'똑같아요'}</b>`:''}${d.inc?` · 수입 ${won(d.inc)}원 중 ${Math.max(0,Math.round((d.inc-d.spend)/d.inc*100))}% 남김`:''}</div>
  <div class="small" style="margin-top:4px">많이 쓴 곳: ${top.map(([g,v])=>`${g} ${man(v)}`).join(' · ')}</div>
  ${up&&pb[up[0]]!==undefined?`<div class="small">가장 많이 늘어난 분류: <b>${esc(up[0])}</b> +${won(up[1])}원</div>`:''}
  ${over.length?`<div class="small" style="color:var(--red)">예산 넘은 분류: ${over.map(x=>esc(x.c)+' '+man(x.s-x.b)+' 넘음').join(', ')}</div>`:''}</div>`}

  applyCats();

function loansFor(m){return Store.all('loan').map(l=>({l,paid:Store.get('lp_'+l.id+'_'+m),dd:ddayOf(m,l.day)})).sort((a,b)=>a.l.day-b.l.day)}
function payoffMonths(B,rate,P){const r=Number(rate||0)/1200;if(!(P>0)||!(B>0))return 0;if(!r)return Math.ceil(B/P);if(P<=B*r)return Infinity;return Math.ceil(-Math.log(1-r*B/P)/Math.log(1+r))}

  <div class="card"><h3>${mLabel(cur)} 갚을 대출</h3>${L.length?`<div class="tblwrap"><table><tr><th>날짜</th><th>대출</th><th>누구</th><th class="m">남은 원금</th><th class="m">매달</th><th class="m">냈어요</th><th></th></tr>${L.map(x=>{const l=x.l,B=Number(l.balance||0),P=Number(l.monthly||0),n=payoffMonths(B,l.rate,P),pct=l.start?Math.max(0,Math.min(100,(1-B/Number(l.start))*100)):0;
    return `<tr><td class="dcell"><span class="dnum">${l.day}일</span>${ddTag(x.dd,!!x.paid)}</td><td>${esc(l.name)} <span class="cat">연 ${Number(l.rate)||0}%</span>${l.start?`<div class="hp" style="height:8px;margin-top:3px"><span style="width:${pct}%"></span></div><span class="small">${Math.floor(pct)}% 갚음 · ${end(n)}</span>`:`<div class="small">${end(n)}</div>`}${x.paid?`<div class="small">이번 달 이자 ${won(x.paid.interest)} · 원금 ${won(x.paid.principal)}</div>`:''}</td><td><span class="who ${whoCls(l.who)}">${esc(l.who)}</span></td><td class="m">${won(B)}</td><td class="m">${won(P)}</td><td class="m"><button type="button" class="btn ${x.paid?'alt':'ghost'}" style="padding:1px 8px;font-size:12px;box-shadow:2px 2px 0 var(--line)" data-lpaid="${l.id}">${x.paid?'☑ 냈어요':'☐'}</button></td><td class="m"><button type="button" class="x" data-loan="${l.id}" aria-label="고치기">✎</button><button type="button" class="x" data-del="${l.id}" aria-label="지우기">✕</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">갚고 있는 대출이 있으면 ＋ 대출 추가를 눌러 적어 주세요.</div>'}</div></div>`}

/* ---------- 세금 (추정) ----------
   종합소득세 기본세율: 2023년 귀속부터 같은 표. 2026-10-26 확인(블로그 여러 곳 일치, 국세청 원문 페이지는 직접 못 읽음 → 추정 표시)
   근로소득공제: 500만 이하 70% / 1,500만 이하 350만+40% / 4,500만 이하 750만+15% / 1억 이하 1,200만+5% / 초과 1,475만+2% (한도 2,000만)
   간이과세자 부가세: 연 1회(1/1~1/25) 신고, 연 매출 4,800만 미만이면 납부 면제, 정보통신업 부가가치율 30% */
const TAX_BRACKETS=[[14e6,.06,0],[50e6,.15,1.26e6],[88e6,.24,5.76e6],[150e6,.35,15.44e6],[300e6,.38,19.94e6],[500e6,.40,25.94e6],[1e9,.42,35.94e6],[Infinity,.45,65.94e6]];
const incomeTax=base=>{if(base<=0)return 0;for(const[lim,r,d]of TAX_BRACKETS)if(base<=lim)return base*r-d};
const wageDed=s=>Math.min(2e7,s<=5e6?s*.7:s<=15e6?3.5e6+(s-5e6)*.4:s<=45e6?7.5e6+(s-15e6)*.15:s<=1e8?12e6+(s-45e6)*.05:14.75e6+(s-1e8)*.02);
const BIZ_CATS=['3.3% 뗀 수입','안 뗀 부업수입'];
const taxCfg=()=>{const c=Store.get('taxcfg')||{id:'taxcfg',kind:'taxcfg',주니:{type:'both',exp:60,ded:0},영이:{type:'free',exp:60,ded:0,weekly:1250000,wkNet:false,payDay:20},wk06:true};
  if(!c.wk06){c.영이={...(c.영이||{}),type:'free',weekly:1250000,wkNet:false,payDay:20};c.wk06=true} // 2026-10 영이 주급 프리랜서(3.3%)로 바뀜
  if(!c.biz)c.biz={name:'부업 사업자',owner:'주니',vat:'간이',open:'2026-10-06',rate:30};return c};
// 주급 프리랜서: 매주 토요일 기준으로 쌓이고, 매달 payDay일에 지난달 토요일 수만큼 들어온다고 봐요
function satCount(y,m){let n=0;const d=new Date(y,m,1);while(d.getMonth()===m){if(d.getDay()===6)n++;d.setDate(d.getDate()+1)}return n}
function weeklyPlan(c,year){const y=Number(year),wk=Number(c.weekly)||0;if(!wk)return null;const gw=c.wkNet?wk/0.967:wk;const t=new Date();const start=c.wkStart||'';
  const pays=[];for(let m=0;m<12;m++){const wy=m?y:y-1,wm=m?m-1:11;const workYm=wy+'-'+String(wm+1).padStart(2,'0');if(start&&workYm<start)continue;
    const n=satCount(wy,wm);const date=new Date(y,m,Number(c.payDay)||20);pays.push({date,n,gross:gw*n,done:date<=t})}
  const gross=pays.reduce((a,p)=>a+p.gross,0),ytd=pays.filter(p=>p.done).reduce((a,p)=>a+p.gross,0);
  return{gw,pays,gross,ytd,weeks:pays.reduce((a,p)=>a+p.n,0)}}
function taxCalc(w,year){const c=taxCfg()[w]||{type:'free',exp:60,ded:0};const wp=c.weekly&&!c.gross?weeklyPlan(c,year):null;
  const es=Store.all('entry').filter(e=>e.type==='수입'&&e.who===w&&e.date.startsWith(year));
  const net33=es.filter(e=>e.cat==='3.3% 뗀 수입').reduce((a,e)=>a+Number(e.amount),0),other=es.filter(e=>e.cat==='안 뗀 부업수입').reduce((a,e)=>a+Number(e.amount),0);
  const t=new Date();const elapsed=String(t.getFullYear())===year?Math.max(1,t.getMonth()+1):12;const k=12/elapsed;
  const g33=net33/0.967;const ytdGross=g33+other;
  const gross=c.gross?Number(c.gross):wp?wp.gross+other*k:ytdGross*k;const prepaid=wp?(c.prepaid!=null&&c.prepaid!==''?Number(c.prepaid):wp.gross*0.033):c.gross?(c.prepaid!=null&&c.prepaid!==''?Number(c.prepaid):gross*(ytdGross?g33/ytdGross:1)*0.033):g33*0.033*k;
  const incomeAmt=gross*(1-(Number(c.exp)||0)/100);const ded=Number(c.ded)||0;
  if(c.type==='both'){ // 월급은 연말정산으로 끝났다고 보고, 부업소득이 얹히면서 늘어나는 세금만 계산
    const sal=Number(c.sal)||0;const salBase=Math.max(0,sal-wageDed(sal)-1.5e6-ded);
    const calcSal=incomeTax(salBase),calcAll=incomeTax(salBase+incomeAmt);const decided=Math.max(0,calcAll-calcSal);const total=decided*1.1;const due=total-prepaid;
    return{c,wp,ytdGross,gross,prepaid,incomeAmt,sal,salBase,calcSal,calcAll,base:salBase+incomeAmt,decided,total,due,k,elapsed}}
  const base=Math.max(0,incomeAmt-1.5e6-ded);
  const calc=incomeTax(base);const decided=Math.max(0,calc-70000);const total=decided*1.1;const due=total-prepaid;
  return{c,wp,ytdGross,gross,prepaid,incomeAmt,base,calc,decided,total,due,k,elapsed}}
function vatCalc(year){const b=taxCfg().biz;if(!b||!b.open||Number(year)<Number(b.open.slice(0,4)))return null;
  const from=String(year)===b.open.slice(0,4)?b.open:year+'-01-01';

  else if((m=s.match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?=\s|$|\s*\d{1,2}:|\s*\()/m))||(m=s.match(/(\d{1,2})월\s*(\d{1,2})일/))){mo=+m[1];d=+m[2]}

  '묶은 머리':["......kk",".....khh",".....khh","....kkkk","..kkhhhh",".khhhhhh","khhhhhhh","khhhhhhh","ksssssss","ksGGGGss","ksGEEGGG","ksGEEGss","ksGGGGss","kpssssss","ksssskww","kssssskk",".kssssss"],

  주니:{hair:'짧은 머리',hairC:'#2b2024',glasses:true,top:'긴팔',topC:'#2c2730',accC:'#b383e0',bot:'긴바지',botC:'#2f2a33',skin:'#ffd7b5',small:false},
  영이:{hair:'긴 머리',hairC:'#2b2024',glasses:false,top:'긴팔',topC:'#2c2730',accC:'#b383e0',bot:'긴바지',botC:'#3d3236',skin:'#ffd7b5',small:true}};

// 한 캐릭터의 그림(색 배열)을 만들어요. o: {blink, step(0/1/2), wave(0/1/2)}
function charGrid(w,o={}){const L=look(w);
  let head=(HAIRS[L.hair]||HAIRS['짧은 머리']).slice(),top=(TOPS[L.top]||TOPS['긴팔']).slice(),bot=(BOTS[L.bot]||BOTS['긴바지']).slice();
  if(L.small){top.splice(4,1);bot.splice(1,2)}
  const rows=[...head,...top,...bot].map(r=>r+[...r].reverse().join(''));
  const g=rows.map(r=>[...r]);const hl=head.length;
  // 눈
  let eyeTop=-1;g.forEach((r,i)=>{if(eyeTop<0&&r.includes('E'))eyeTop=i});
  g.forEach((r,i)=>r.forEach((ch,j)=>{if(ch==='E')r[j]=(o.blink&&i===eyeTop)?'s':'k';else if(ch==='G')r[j]=L.glasses?'G':'s'}));
  // 걸을 때 한쪽 발 들기
  if(o.step){const c0=o.step===1?0:8,n=g.length;for(let i=n-4;i<n;i++)for(let j=c0;j<c0+8;j++)g[i][j]=i+1<n?g[i+1][j]:'.'}
  // 손 흔들기: 오른쪽 위로 팔 올리기
  let extra=[];if(o.wave){const hx=o.wave===1?16:17,hy=hl+1;extra=[[hx,hy-4,'s'],[hx,hy-3,'s'],[16,hy-2,'T'],[16,hy-1,'T'],[15,hy,'T']];for(let i=hl+3;i<hl+7&&i<g.length;i++){if(g[i][14]!=='.')g[i][14]='T';g[i][15]='k'}}
  const pal={k:'#241a22',h:L.hairC,s:L.skin,p:'#ff9d9d',w:'#ffffff',G:'#2b2024',T:L.topC,v:L.accC,B:L.botC,L:'#141014',l:'#5a5060'};
  const out=g.map(r=>{const a=r.map(ch=>ch==='.'?null:pal[ch]||null);a.length=18;return a});
  for(const[x,y,ch]of extra)if(y>=0&&out[y])out[y][x]=pal[ch];
  return out}

    {l:[[Y,'주말에 산책 갈래?'],[J,'좋아, 공짜 데이트!']]},
    {l:[[J,'커피 한 잔 사 줄까?'],[Y,'집에서 타 먹자 ☕']]},
    {l:[[Y,'오늘 쓴 거 적었어?'],[J,'앗 지금 적을게!']]},
    {l:[[J,'돼지야 배고프지?'],[Y,'동전 넣어 주자 🪙']],coin:true}];
  return {data:L,casual}}
function startTalk(force){const t=talks();let pool=(t.data.length&&Math.random()<.65)?t.data:t.casual;
  let k=Math.random()*pool.length|0;if(pool.length>1&&k===Anim.lastTalk)k=(k+1)%pool.length;Anim.lastTalk=k;
  const cv=pool[k];const a=Anim.c[cv.l[0][0]],b=Anim.c[other(cv.l[0][0])];
  Anim.talk={...cv,i:-1,next:0,meet:!RM.matches&&(Math.hypot(a.x-b.x,a.y-b.y)>3||Math.abs((a.x-a.y)-(b.x-b.y))<2.2)};
  if(Anim.talk.meet){const w=cv.l[0][0];const sx=b.x-b.y>3.5?-1:1;walkTo(w,b.x+1.2*sx,b.y-1.2*sx);Anim.c[other(w)].tx=null}}
function stepTalk(now){const T=Anim.talk;
  if(T.meet){const w=T.l[0][0];if(Anim.c[w].tx!=null)return;T.meet=false}
  if(now<T.next)return;T.i++;
  if(T.i>=T.l.length){if(T.heart){const a=Anim.c.주니,b=Anim.c.영이;Anim.heart={x:(a.x+b.x)/2,y:(a.y+b.y)/2,t:0}}
    if(T.coin)dropCoin();Anim.talk=null;Anim.nextTalk=now+14000+Math.random()*22000;return}
  const[w,text]=T.l[T.i];const ms=2200+text.length*90;say(w,text,ms);T.next=now+ms+250}
function dropCoin(){Anim.coin=0}
// 새 기록이 생기면 캐릭터가 반응해요
function reactToNew(){const ids=new Set(Store.all('entry').map(e=>e.id));
  if(!Anim.seen){Anim.seen=ids;return}
  for(const id of ids)if(!Anim.seen.has(id)){const e=Store.get(id);if(!e||String(id).startsWith('fx_'))continue;const w=e.who==='같이'?me():e.who;if(!Anim.c[w])continue;
    if(e.type==='저축'){hop(w);hop(other(w));dropCoin();say(w,'저금 완료! 🪙')}
    else if(e.type==='수입'){hop(w);say(w,'돈 들어왔다! 🎉')}
    else if(e.type==='지출'){Number(e.amount)>=100000?say(w,(e.memo||e.cat)+'… 좀 컸다 💦'):say(w,(e.memo||e.cat)+' 적었어 ✍️')}}
  Anim.seen=ids}

function tick(now){requestAnimationFrame(tick);
  const cv=document.getElementById('cv');if(!ROOM||!cv||document.hidden)return;
  if(now-Anim.last<90)return;const dt=Math.min(.3,(now-Anim.last)/1000);Anim.last=now;
  const still=RM.matches,sleep=night();
  if(!Anim.nextTalk)Anim.nextTalk=now+5000;
  if(!sleep){if(Anim.talk)stepTalk(now);else if(now>Anim.nextTalk)startTalk()}
  const chars=[];
  for(const w of['주니','영이']){const c=Anim.c[w];const talking=Anim.talk&&!Anim.talk.meet;
    let step=0;
    if(!still&&!sleep&&c.tx!=null){const dx=c.tx-c.x,dy=c.ty-c.y,dist=Math.hypot(dx,dy),v=1.4*dt;
      if(dist<=v){c.x=c.tx;c.y=c.ty;c.tx=null;c.wait=2+Math.random()*6}else{c.x+=dx/dist*v;c.y+=dy/dist*v;c.ph+=dt;step=(Math.floor(c.ph*5)%2)+1}}
    else if(!still&&!sleep&&!talking&&!(Anim.talk&&Anim.talk.meet)){c.wait-=dt;if(c.wait<=0)pickWalk(w)}
    if(now>c.blinkAt){c.blink=now+140;c.blinkAt=now+2200+Math.random()*3500}
    let dy=0;if(c.jump>0&&!still){dy=-Math.round(Math.sin(c.jump*Math.PI)*5);c.jump-=dt*2.2;if(c.jump<=0)c.jump=0}
    else if(!still&&step===0)dy=Math.sin(now/650+(w==='영이'?1.7:0))>.55?1:0;
    if(step)dy=step===1?-1:0;
    let wave=0;if(c.wave>now&&!still)wave=(Math.floor(now/180)%2)+1;
    chars.push({x:c.x,y:c.y,dy,g:charGrid(w,{blink:sleep||now<c.blink,step,wave})});
    if(sleep&&!c.say)say(w,'Z z z',3000)}
  let heart=null;if(Anim.heart){Anim.heart.t+=dt;heart={x:Anim.heart.x,y:Anim.heart.y,rise:Math.round(Anim.heart.t*8)};if(Anim.heart.t>1.6||still)Anim.heart=null}
  let coin=null,pigX=0;if(Anim.coin!=null){Anim.coin+=dt*1.6;if(Anim.coin<1)coin=Anim.coin;else{Anim.pig=.6;Anim.coin=null}}
  if(Anim.pig>0){pigX=still?0:(Math.floor(now/80)%2?1:-1);Anim.pig-=dt}else if(!still&&Math.random()<.002)Anim.pig=.4;
  ROOM.frame({chars,heart,coin,pigX});
  // 이름표·상태 메시지·말풍선 위치 맞추기
  const{P,W,H}=ROOM;
  const anySay=['주니','영이'].some(w=>Anim.c[w].say&&Anim.c[w].say.until>now);
  for(const w of['주니','영이']){const c=Anim.c[w],el=Anim.els[w];if(!el||!el.name.isConnected)continue;const p=P(c.x,c.y),h=chars[w==='주니'?0:1].g.length;
    const L=(p[0]/W*100)+'%';el.name.style.left=L;el.name.style.top=((p[1]+2)/H*100)+'%';
    const top=((p[1]-h-3)/H*100)+'%';el.bub.style.left=L;el.bub.style.top=top;el.st.style.left=L;el.st.style.top=top;
    const sNow=c.say&&c.say.until>now?c.say.text:'';if(c.say&&c.say.until<=now)c.say=null;
    if(el.bub.textContent!==sNow)el.bub.textContent=sNow;el.bub.hidden=!sNow;
    const st=statusOf(w);if(el.st.dataset.t!==st){el.st.dataset.t=st;el.st.textContent='💭 '+st}el.st.hidden=!st||anySay}
  const nt=document.getElementById('nightTint');if(nt)nt.hidden=!sleep;
}
requestAnimationFrame(tick);

function drawHome(){
  ROOM=drawRoomCanvas();const{P,W,H}=ROOM;const room=document.getElementById('room');
  const d=monthData(cur),saved=savedTotal(),s=settings();
  const tag=(pt,html,cls,dy,go)=>{const el=document.createElement(go?'button':'div');if(go){el.type='button';el.dataset.go=go}el.className=cls;el.innerHTML=html;el.style.left=(pt[0]/W*100)+'%';el.style.top=((pt[1]+dy)/H*100)+'%';room.appendChild(el);return el};
  const nearest=nextDue(cur);
  const emer=emerTotal();
  const tint=document.createElement('div');tint.id='nightTint';tint.className='nighttint';tint.hidden=!night();room.appendChild(tint);
  tag(P(8.9,5.9,0),'모은 돈 <b>'+man(saved)+'</b>','tag',-17,'save');
  tag(P(0,8.1,5.7),Number(cur.slice(5))+'월 카드값 <b>'+man(d.bill)+'</b>','tag',0,'card');
  {const T=spendSum(cur);tag(P(4.6,1.2,2.2),'현금지출 <b>'+man(T.cash)+'</b>','tag',0,'spend');tag(P(2.6,9.6,1.6),'총 지출 <b>'+man(T.total)+'</b>','tag',0,'spend').title='현금지출 '+won(T.cash)+' + 카드값 '+won(T.bill)+' + 고정지출 '+won(T.fixed)+(T.loan?' + 대출 '+won(T.loan):'')}
  tag(P(9.3,.8,2.3),'비상금 <b>'+man(emer)+'</b>','tag',0,'save');
  {const fx=fixedFor(cur),left=fx.filter(x=>!x.paid).length;if(fx.length)tag(P(3.2,0,6.6),'고정지출 <b>'+man(fx.reduce((a,x)=>a+Number(x.f.amount||0),0))+'</b>'+(left?' · '+left+'건 남음':' · 다 냄'),'tag',0,'fixed')}
  for(const w of['주니','영이']){const c=Anim.c[w],p=P(c.x,c.y);
    const name=tag(p,w,'name',2);
    const st=tag(p,'','status',-34);st.title=w+' 꾸미기·상태 메시지';st.hidden=true;st.dataset.t='';st.onclick=()=>{if(w===me())lookDlg(w);else{say(w,'내 상태는 내가 바꿀래 😜');hop(w)}};
    const bub=tag(p,'','bubble',-34);bub.hidden=true;bub.setAttribute('aria-live','polite');
    Anim.els[w]={name,st,bub}}
  reactToNew();
  // 캐릭터를 누르면: 내 캐릭터는 꾸미기, 상대는 손 흔들고 말 걸기
  document.getElementById('cv').onclick=e=>{const r=e.target.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
    for(const w of['주니','영이']){const c=Anim.c[w],p=P(c.x,c.y);if(Math.abs(x-p[0])<=9&&y<=p[1]+2&&y>=p[1]-36){
      Anim.c[w].wave=performance.now()+1500;hop(w);
      if(w===me())lookDlg(w);else{say(w,['안녕! 👋','불렀어?','오늘도 화이팅!','나 보고 싶었지?'][Math.random()*4|0]);if(!Anim.talk)setTimeout(()=>{if(!Anim.talk)startTalk()},1800)}return}}};
}

/* ---------- 꾸미기 창 ---------- */
function swatch(name,list,sel){return `<div class="chips sw" data-chips="${name}">${list.map(([n,c])=>`<button type="button" aria-pressed="${c===sel}" data-c="${c}" title="${n}" aria-label="${n}" style="background:${c}"></button>`).join('')}</div>`}
function lookDlg(w){const L=look(w);
  openDlg(w+' 꾸미기',`<div class="lookwrap"><canvas id="lookPrev" width="20" height="40"></canvas><div style="display:grid;gap:10px;min-width:0">
  <label class="f">상태 메시지 (20자까지)<input type="text" id="fStatus" maxlength="20" value="${esc(statusOf(w))}" placeholder="예) 이번 주 무지출 도전 중"></label>
  <label class="f">머리 모양${chips('hair',Object.keys(HAIRS),L.hair)}</label>
  <label class="f">머리색${swatch('hairC',COLORS.hair,L.hairC)}</label>
  <label class="f">윗옷${chips('top',Object.keys(TOPS),L.top)}</label>
  <label class="f">윗옷 색${swatch('topC',COLORS.cloth,L.topC)}</label>
  <label class="f">목둘레 포인트 색${swatch('accC',[['연보라','#b383e0'],...COLORS.cloth],L.accC)}</label>
  <label class="f">아랫옷${chips('bot',Object.keys(BOTS),L.bot)}</label>
  <label class="f">아랫옷 색${swatch('botC',[['먹색','#2f2a33'],['밤색','#3d3236'],...COLORS.cloth],L.botC)}</label>
  <label class="f">안경${chips('glasses',['쓰기','안 쓰기'],L.glasses?'쓰기':'안 쓰기')}</label>
  <label class="f">피부색${swatch('skin',COLORS.skin,L.skin)}</label>
  <label class="f">키${chips('small',['보통','아담'],L.small?'아담':'보통')}</label></div></div>`,'저장',()=>{
    const nl=cur2();Store.put({...nl,id:'look_'+w,kind:'look',who:w});
    const st=val('fStatus');const old=Store.get('status_'+w);if((old?.text||'')!==st)Store.put({id:'status_'+w,kind:'status',who:w,text:st});
    toast('저장했어요');hop(w)});
  const cur2=()=>({hair:chipVal('hair'),hairC:chipVal('hairC'),glasses:chipVal('glasses')==='쓰기',top:chipVal('top'),topC:chipVal('topC'),accC:chipVal('accC'),bot:chipVal('bot'),botC:chipVal('botC'),skin:chipVal('skin'),small:chipVal('small')==='아담'});
  const prev=()=>{const cv=document.getElementById('lookPrev');if(!cv)return;const saved=Store.recs['look_'+w];
    Store.recs['look_'+w]={...cur2(),id:'look_'+w,kind:'look'};const g=charGrid(w);if(saved)Store.recs['look_'+w]=saved;else delete Store.recs['look_'+w];
    const x=cv.getContext('2d');x.clearRect(0,0,20,40);g.forEach((r,i)=>r.forEach((c,j)=>{if(c){x.fillStyle=c;x.fillRect(j+1,40-g.length+i,1,1)}}))};
  document.getElementById('dbody').onclick=()=>setTimeout(prev,0);prev()}

/* ---------- 데스크톱 위젯 (주소 끝에 #widget) ---------- */
function vWidget(){cur=ym(today());const d=monthData(cur),s=settings(),saved=savedTotal(),nd=nextDue(cur);
  return `<div class="wv"><div class="room" id="room"><canvas id="cv"></canvas></div>
  <div class="wnums"><button type="button" data-open="spend"><span>이번 달 쓴 돈</span><b>${man(d.spend)}</b></button><button type="button" data-open="card"><span>나갈 돈</span><b>${nd!=null?'D-'+(nd||'DAY'):man(d.bill)}</b></button><button type="button" data-open="save"><span>모은 돈</span><b>${s.goal?Math.round(saved/s.goal*100)+'%':man(saved)}</b></button></div></div>`}

/* ---------- 시작 ---------- */
(function(){const ic=document.getElementById('ico').getContext('2d');["001111100","011111110","111101111","111101111","111101111","111101111","111101111","011111110","001111100"].forEach((r,i)=>[...r].forEach((v,j)=>{if(v==='1'){ic.fillStyle='#f6c445';ic.fillRect(j,i,1,1)}}))})();
document.getElementById('tabs').addEventListener('click',()=>{});
// 위젯 창과 큰 창이 같은 기록을 써요: 한쪽에서 적으면 다른 창도 바로 바뀌어요
addEventListener('storage',e=>{if(e.key==='jy.recs'){Store.recs=ls.get('jy.recs',{});render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(!b)return;window.open(location.href.split('#')[0]+'#'+b.dataset.open,'_blank')});
setInterval(()=>{if(WIDGET&&cur!==ym(today()))render()},60000);
render();Sync.start();
if(ls.get('jy.joined',false)){ls.set('jy.joined',false);setTimeout(()=>toast('함께 쓰기 연결했어요!'),300)}
if(!WIDGET&&!ls.get('jy.meSet',false)){ls.set('jy.meSet',true);setTimeout(meDlg,400)}
